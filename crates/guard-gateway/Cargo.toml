[package]
name = "guard-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "协作式工具网关：智能体调它而不是调原始工具，于是判决可以变成拒绝执行"

[[bin]]
name = "agentguard-mcp"
path = "src/bin/agentguard_mcp.rs"

[features]
memory-sqlcipher = ["guard-audit/sqlcipher"]

[dependencies]
guard-trust = { workspace = true }
guard-schema = { workspace = true }
guard-shell = { workspace = true, features = ["test-helpers"] }
guard-core = { workspace = true }
guard-intel = { workspace = true }
guard-privacy = { workspace = true }
base64 = "0.22"
# `default-features = false` 删掉了。
#
# 它一直是个空操作:guard-audit 是通过 [workspace.dependencies] 引的,而那里没写
# default-features,所以 cargo 直接忽略这个键 —— 并且警告说以后可能变成硬错误。
#
# 保留它的"意图"也没意义:整个 workspace 共用一次特性解析,guard-core 引 guard-audit
# 时是带默认特性的,所以 sqlite-bundled 无论如何都是开的。要真的关掉,得改
# [workspace.dependencies] —— 那会影响每一个成员,是另一件事(见 make test-sqlcipher)。
guard-audit = { workspace = true }
rand = "0.8"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tiny_http = "0.12"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# 禁止 Schema 自动读取宿主文件或请求网络，另由代理显式拒绝外部引用。
jsonschema = { version = "=0.51.0", default-features = false }
# 复用仓库已核查版本；只启用 ring、标准库与 TLS 1.2，不使用系统代理。
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
ed25519-dalek = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "aarch64")'.dependencies]
# 内建工具身份要计算完整可执行文件摘要。启用 sha2 的运行时硬件检测，
# 避免 ARM 开发构建逐块运行软件压缩；不支持 SHA 指令的 CPU 仍走原算法回退。
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
serde_yaml = { workspace = true }
