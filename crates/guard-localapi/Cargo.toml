[package]
name = "guard-localapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Loopback HTTP status/audit API for AgentGuard"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = "0.12"
guard-trust = { workspace = true }
guard-schema = { workspace = true }
guard-core = { workspace = true }
guard-audit = { workspace = true }
guard-intel = { workspace = true }
android-adapter = { workspace = true }
uuid = { workspace = true }
hex = "0.4"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand = "0.8"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
ureq = "2"
