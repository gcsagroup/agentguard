[package]
name = "guard-billing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Pro/Enterprise entitlement activation for AgentGuard"

[dependencies]
guard-trust = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sha2 = "0.10"
hex = "0.4"
tiny_http = "0.12"
# P2-7:厂商签名授权(Ed25519)。工作区里已有(guard-audit / guard-intel),不新增 crate。
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
ureq = "2"
