<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AgentGuard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="row">
      <h1 data-i18n="extensionName">AgentGuard Web Shield</h1>
      <select id="locale">
        <option value="system" data-i18n="system">System</option>
        <option value="en" data-i18n="english">English</option>
        <option value="zh_CN" data-i18n="simplifiedChinese">简体中文</option>
        <option value="zh_TW" data-i18n="traditionalChinese">繁體中文</option>
      </select>
    </div>
    <div class="row">
      <input type="checkbox" id="native" />
      <label for="native" data-i18n="nativeForward">Forward to desktop (Native Messaging)</label>
    </div>
    <p class="muted" id="hint" data-i18n="recentDetections">Recent detections</p>
    <ul id="list"></ul>
    <p class="muted" data-i18n="blockedHosts">Blocked network destinations</p>
    <ul id="blocklist"></ul>
    <script src="popup.js"></script>
  </body>
</html>
