# Agent 身份注册表。默认不预置任何公钥；登记名称不等于身份已验证。
#
# 为真实部署启用身份归属时，用 agentguard agent-keygen 生成各自的密钥，
# 私钥仅由对应 Agent 持有，将公钥填入其 public_key 字段。
# 不可把 eval/fixtures 中的公开测试密钥复制到此处。
# 历史默认模板的两把公开密钥保留在 eval/fixtures/public-agent-registry.yaml，
# 仍由判决层识别为 PubliclyKnownKey，不能产生 Verified。
#
# 当前已发布适配器并非全部支持会话签名，因此沿用可选认证设置。
# 无公钥时仅显示 NoKeyOnRecord，不能获得已验证身份；如果开启
# require_attestation，未完成实际密钥配置的会话会被拒绝。
require_attestation: false
agents:
  - agent_id: claude-desktop
    display_name: Claude Desktop
    task_profiles: [book_hotel, order_food, preference_save, navigation_jump]
    notes: "待配置真实公钥；名称本身不授予身份或权限。"

  - agent_id: shopping-helper
    display_name: Shopping Helper
    task_profiles: [order_food, book_hotel, navigation_jump]
    notes: "仅列出零售任务范围；待配置真实公钥。"

  - agent_id: legacy-macro-bot
    display_name: Legacy Macro Bot
    notes: "未配置签名身份，不能验证。"
