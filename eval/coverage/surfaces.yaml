  - id: aura-session-scope
    paper: aura
    section: "4.4"
    name: Session-scoped least privilege (SA session token constrained to S_max)
    paper_result: "design proposal; the God Mode over-provisioning it removes"
    status: partial
    mechanism: >
      `TaskScope` on each plan + `APP-NOT-IN-TASK` / `SCOPE-DATA` / `SCOPE-HOST` /
      `SCOPE-OVER-REQUEST` (iteration 20). Trajectory alignment (§4.3.2) constrains what *kinds*
      of step a task may take; this constrains which **resources** those steps may touch — apps,
      profile keys, destination hosts.

      The ceiling is the plan's `scope:`, which `policies/task-plans.yaml` is explicit about not
      taking from the agent. The session's `task_apps` / `task_data_keys` / `task_hosts` are a
      **request**, and the grant is the intersection — narrowing is safe in a way widening is not,
      and before this the agent picked its own app set with nothing above it. Over-requests are
      reported once and dropped from the grant. The grant itself is written into the
      `SESSION-START` audit row, because Aura calls the token a trust boundary and a boundary
      nobody can see is not one.

      Host matching is on the **dot boundary** — the host or a subdomain of it — so
      `secure-checkout-stripe.com` is out of a grant for `stripe.com`, and the authority ends at a
      backslash as well as a slash (`evil.example\.stripe.com` is evil.example, not a Stripe
      subdomain). Only **egress** events are judged: a granted app reading its own site is not
      sending to it. Absent and empty are
      different: an omitted dimension is unconstrained, `hosts: []` is an explicit "never
      egresses".

      This iteration also closed three gaps in the mechanisms it extends: the pre-existing `task_apps`
      check lived in `with_transition_guard`, which only four event arms reach, so `ui_tree_delta` —
      the event every adapter emits most — was never checked against the task's app set at all; the
      eval runner mapped unknown `event_type` names to `UiTreeDelta` with a catch-all, so the corpus's
      `network_meta` and `deeplink_open` scenarios ran as UI deltas; and the Android envelope had no
      `session_start` kind.
    rules: []
    scenarios:
      - scope_app_outside_ceiling
      - scope_data_key_outside_ceiling
      - scope_over_request_refused
      - scope_host_suffix_forgery
      - benign_scope_conforming_booking
    note: >
      Held at `partial`.

      **The ceiling is only as good as the plan.** A profile with no `scope:` is unconstrained, and
      that default is deliberate — failing closed would deny every task an operator has not yet
      scoped, which means the field never gets adopted, the same reasoning as `require_plan: false`.
      So an unplanned or unscoped session has no resource ceiling at all, and the shipped library
      covers four profiles.

      **A ceiling is a policy statement, and getting it wrong denies legitimate work.** The first
      draft of the shipped scopes invented key names the project's own `GuardContract` vocabulary
      does not use, and turned nine existing benign scenarios into Critical blocks; a second error
      left Meituan out of `book_hotel`, which is wrong in this market. Both were caught by the
      corpus, which is the argument for having one.

      **No semantic permissions beyond these three dimensions.** Aura's model is domains plus
      semantic permissions; this is apps, profile keys and hosts. There is no scope over deeplink
      schemes, clipboard use, or which *fields within* an app may be written.

      **The request channel is unauthenticated**, and "narrowing is harmless" was too strong: a
      request on a dimension with no ceiling used to be *installed* as the grant, which turned a bogus
      request into a block storm and, under `--confirm deny`, a paused engine. Requests are now
      ignored where there is no ceiling. The residue is that a narrowing is not attributable to the
      agent unless the session is attested.

      **Nothing declares a task unless a host or human chooses to.** The mechanism was first
      reachable only from the eval harness — every adapter's `start_session` sent empty metadata, so
      four hosts loaded the plan library and none could select from it. Now wired via
      `TaskDeclaration` / `start_task_session`, the envelope's `session_start` kind, both desktop
      shells (plan library + task selector) and `guard-cli replay`. Still: the default in every shell
      is unscoped, `guard-nm-host` has no session concept, and the desktop shells cannot be compiled
      in this environment so their wiring is parse-checked rather than run.

      **Nothing enforces that the grant was minimal.** A plan may declare a wide scope, and the
      guard has no way to know the task did not need it; least privilege is expressible here, not
      provable.

