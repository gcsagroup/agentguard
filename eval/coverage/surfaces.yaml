# Published attack surfaces → AgentGuard coverage.
#
# This file is CHECKED, not just written: `guard-cli coverage` verifies that every
# rule id named here exists in the ruleset, that every scenario named here exists
# and passes, and that no scenario is silently uncovered. A hand-maintained matrix
# rots; one that CI verifies cannot claim coverage it does not have.
#
# status:
#   covered  - a mechanism exists AND a scenario exercises it
#   partial  - a mechanism exists but is weaker than the paper's attack, or only a
#              proxy for it. `note` must say how.
#   none     - no coverage. `note` must say what it would take.
#
# `paper_result` records what the paper measured, so our numbers are never mistaken
# for theirs.
version: 1

papers:
  aisees:
    title: "(A)I Sees What You Don't: Exploiting New Attack Surfaces in Third-Party Mobile Agents"
    arxiv: "2607.00333"
  agentscan:
    title: "From Assistants to Adversaries: Exploring the Security Risks of Mobile LLM Agents"
    arxiv: "2505.12981"
  aura:
    title: "Blind Gods and Broken Screens: Architecting a Secure, Intent-Centric Mobile Agent OS"
    arxiv: "2602.10915"
  myphonebench:
    title: "Do Phone-Use Agents Respect Your Privacy?"
    arxiv: "2604.00986"

surfaces:
  # ---------------------------------------------------------------- (A)I Sees
  - id: aisees-a1
    paper: aisees
    section: "IV-B / V-C"
    name: Subliminal visual injection
    paper_result: "18/20–20/20 across six VLM backends at 2/5/8/10/20% opacity"
    status: covered
    mechanism: "mac-adapter::subliminal two-band grid contrast + Vision OCR sanitization loop"
    rules: [OVL-007, OVL-004]
    scenarios: [inject_subliminal_pixel, inject_subliminal_ocr, inject_subliminal_block]
    note: >
      Strong band [0.008,0.08) plus a wide band [0.08,0.22) added in iter 6 to cover
      the paper's upper opacity levels. Luma contrast is a proxy for alpha, so the
      mapping from a stated opacity to a cell-contrast threshold is calibrated
      synthetically, not against the paper's rendering.

  - id: aisees-a2
    paper: aisees
    section: IV-B
    name: Invisible-zone injection (rounded corners / cutout)
    paper_result: "payload rendered in the display invisible zone; w = R − sqrt(R² − (R−y)²)"
    status: covered
    mechanism: "guard-overlay::DisplayGeometry masked-zone model + edge-zone heuristic"
    rules: [OVL-006, OVL-012]
    scenarios: [overlay_invisible_zone, masked_zone_corner]
    note: >
      Corner width formula implemented and unit-tested against the paper's
      R = 132 → w ≈ 78 at y = 12. Cutout rectangles must be supplied by the host;
      nothing here reads DisplayCutout automatically.

  - id: aisees-a3
    paper: aisees
    section: IV-B
    name: UI spoofing (phishing Activity over a target app)
    paper_result: "20/20 across all five frameworks (WeChat credential theft)"
    status: partial
    mechanism: "Engine ProcessFocus tracking → APP-TRANSITION; per-task app allowlist"
    rules: [PRIV-001]
    scenarios: [app_transition_hijack, task_allowlist_block]
    note: >
      Detects a foreground/actor mismatch and off-task apps. Does NOT verify that
      the Activity on screen belongs to the app it imitates — that needs app
      identity (signing cert), which is the aura-i gap below.

  - id: aisees-a4
    paper: aisees
    section: IV-C
    name: Screenshot tampering in the TOCTOU window
    paper_result: "19/20–20/20 vs 4 of 5 agents; window 50–500 ms, mean ~210 ms"
    status: covered
    mechanism: "mac-adapter::framehash grid digest (luma+chroma) + signed frame_digest; stego chroma detector"
    rules: [OVL-003, OVL-011, OVL-013]
    scenarios: [frame_region_tamper, overlay_screenshot_tamper_alert, android_overlay_tamper, stego_chroma_hint, stego_lsb_hint]
    note: >
      The ~2 FPS capture stream cannot observe a 50 ms window; the short end of the
      paper's range needs an on-demand double capture at the point of use.

  - id: aisees-a5
    paper: aisees
    section: IV-C
    name: Broadcast input interception (ADB_INPUT_B64)
    paper_result: "20/20 vs Open-AutoGLM, MobA, Mobile-Agent-v3"
    status: partial
    mechanism: "EnvironmentScanner queryBroadcastReceivers survey → standing EnvRisk"
    rules: [ENV-A5]
    scenarios: [android_broadcast_input_sink, android_high_tier_while_sniffed]
    note: >
      Manifest-declared receivers only: an app that calls registerReceiver() at
      runtime is invisible. Package visibility also caps the list to the two
      declared actions.

  - id: aisees-a6
    paper: aisees
    section: IV-C
    name: Credential sniffing via a foreign accessibility service
    paper_result: "20/20 across all five frameworks"
    status: covered
    mechanism: "EnvironmentScanner enabled-service survey + text-capturing subset"
    rules: [ENV-A6]
    scenarios: [android_foreign_a11y_service, android_high_tier_while_sniffed, android_env_survey_partial]
    note: >
      Detection only, and presence is not proof of malice — a legitimate screen
      reader appears on this list, which is why it alerts rather than blocks.

  - id: aisees-a7
    paper: aisees
    section: IV-C
    name: Host-side command injection (shell=True on VLM text)
    paper_result: "20/20 vs AppAgent, AppAgentX, MobA, Mobile-Agent-v3"
    status: partial
    mechanism: "guard-shell metacharacter screening before the allowlist + argv construction"
    rules: []
    scenarios: []
    note: >
      Unit-tested in guard-shell rather than as an engine scenario: SafeShell is a
      host-side gate, not an event on the decision pipeline, so no rule id or
      scenario applies. Advisory only — see docs/scope-and-non-goals.md.

  # ---------------------------------------------------------------- AgentScan
  - id: agentscan-display-injection
    paper: agentscan
    section: "GUI layer"
    name: Prompt injection via display
    paper_result: "multiple agents vulnerable"
    status: covered
    mechanism: "Text/intel injection rules over ui_text from AX + OCR"
    rules: [OVL-004]
    scenarios: [inject_system_override_block, intel_inject_block, android_inject_override]

  - id: agentscan-transparent-overlay
    paper: agentscan
    section: "GUI layer"
    name: Transparent overlay
    paper_result: "multiple agents vulnerable"
    status: covered
    mechanism: "guard-overlay opacity / font-size heuristics"
    rules: [OVL-001, OVL-002]
    scenarios: [overlay_transparent_alert, overlay_invisible_block]

  - id: agentscan-popup
    paper: agentscan
    section: "GUI layer"
    name: Pop-up interference (injected between decision and execute)
    paper_result: "10/10 on 7 agents"
    status: partial
    mechanism: "Engine::revalidate_ui UI-fingerprint comparison on consecutive UiTreeDelta"
    rules: [UI-REVALIDATE]
    scenarios: [ui_revalidate_popup]
    note: >
      Right mechanism, coarse granularity: it compares whole-tree fingerprints, not
      "is the element under the target coordinate still the intended element",
      which is what a coordinate-based click redirection actually needs.

  - id: agentscan-viewtree
    paper: agentscan
    section: "GUI layer"
    name: Viewtree interference (a11y hierarchy diverges from render)
    paper_result: "8 of 9 agents vulnerable (2–10/10) — the broadest surface"
    status: covered
    mechanism: "mac-adapter::viewtree token-set cross-validation of AX text vs frame OCR"
    rules: [OVL-009, OVL-010]
    scenarios: [viewtree_screen_only, viewtree_tree_only]
    note: >
      Requires OCR to have run for the same screen; the native bridge OCRs every
      8th frame plus whenever a subliminal band trips.

  - id: agentscan-deeplink-forgery
    paper: agentscan
    section: "System layer"
    name: Deeplink forgery
    paper_result: "system-interacting agents vulnerable"
    status: covered
    mechanism: "KnownAppsPolicy per-app deeplink allowlist"
    rules: [OVL-005]
    scenarios: [deeplink_forgery_block, deeplink_intent_block, deeplink_transfer_block, browser_deeplink_payload, android_deeplink_intent]

  - id: agentscan-package-forgery
    paper: agentscan
    section: "System layer"
    name: Package-name forgery
    paper_result: "all 4 system-interacting agents vulnerable"
    status: partial
    mechanism: >
      App identity is the SHA-256 of the signing certificate, pinned per package in
      policies/known-apps.yaml. Packages match exactly (substring matching let
      com.sankuai.meituan.evil inherit Meituan's allow-list); a registered app's
      privileges — its deeplink allow-list, and HIGH-tier sink clearance in the
      information-flow lattice — are granted only on AppIdentity::Verified. A signer
      mismatch is APP-SIGNER-MISMATCH (critical block), a missing or unrecordable
      attestation is APP-UNATTESTED plus withheld privilege (DL-UNVERIFIED), and a
      verified app that later presents a different signer is APP-IDENTITY-CHANGED.
      Android digests come from PackageManager.GET_SIGNING_CERTIFICATES, read by
      AppAttestor and attached to every emitted event by PayloadSerializer. Loadable
      from `api-serve --known-apps`, the native-messaging host, and
      `ag_engine_new_with_registry`; enforcement is the registry's
      `require_attestation`, off by default.
    rules: []
    scenarios:
      - app_signer_mismatch
      - app_name_mismatch
      - app_identity_changed_midsession
      - app_impersonation_retry
      - app_identity_inherited_by_name
      - app_identity_forged_public_digest
      - app_identity_pin_ride_after_signed
      - app_unattested_deeplink
      - app_no_signer_on_record
      - flow_clearance_needs_verified_app
      - deeplink_forgery_block
    note: >
      `partial`, not `covered`, for three reasons.

      (1) **The digest is only as good as the adapter that produced it — and this is
      now enforced, not just documented.** An adapter that asks the OS
      (PackageManager on Android, SecCodeCopySigningInformation on macOS) is asking
      something the agent cannot forge. An adapter that forwards a digest the agent
      handed it gains nothing at all.

      This paragraph used to end "the Rust engine reads `signer_sha256` off the
      event, so the guarantee lives in the adapter, not here". That sentence
      described a hole and left it open: app signing digests are **public**
      (`apksigner verify --print-certs`, `codesign -dv`), so an attested digest is
      an identifier, not a secret, and anyone holding the local API token could
      present a correct one. Package-name forgery had simply moved one level up —
      from "pick any package name" to "pick a digest anyone can look up".

      The engine now refuses to reach `AppIdentity::Verified` unless the assertion
      arrived through a **verified adapter** (`AdapterIdentity::may_grant_trust`);
      otherwise it reports `AttestationUnverified`, which is still held to that
      app's own allow-list but inherits none of its privileges. Evidence *against*
      an identity — `SignerMismatch`, and a mid-session change of signer — is
      unaffected by the carrier, which is the same asymmetry the environment-survey
      rule follows. `app_identity_forged_public_digest` and
      `benign_flow_verified_task_app` are the attack/control pair; the second
      declares `via_verified_adapter` and the first is byte-identical without it.

      A third scenario, `app_identity_pin_ride_after_signed`, covers the **mixed**
      sequence — one legitimately signed sighting followed by an unsigned event
      claiming the same package. That was the hole in the first version of this fix,
      found by an independent adversarial review: the downgrade changed the *computed*
      identity while every consumer reads the *stored pin* (`app_identities`), and the
      downgrade path early-returned before updating it. So one signed sighting
      re-opened the hole for the rest of the session — in precisely the deployment
      shape where the fix was supposed to matter. No scenario covered the mixed
      sequence at the time: every scenario set `via_verified_adapter` on all
      identity-bearing events or on none. The scenario asserts on a HIGH-tier data
      flow rather than on the deeplink, because the deeplink sits in that app's own
      allow-list either way — the privilege that actually leaked is the
      `verified_names` entry.

      What keeps this `partial` rather than `covered` is the consequence: no shipped
      adapter signs yet, so in the shipped configuration **no app reaches
      `Verified`** — a real verified identity cannot get through either. That is a
      functional cost, not a hole, and preflight reports it
      (`adapter.keys.absent`). See docs/app-identity.md.

      (2) **The shipped digests are fixtures, not real publisher certificates**, and
      deliberately obvious ones. A registry pinning a wrong digest is worse than no
      registry: it looks verified and verifies nothing. A test asserts they stay
      obvious so that pinning a real value is a deliberate act.

      (3) **macOS and Windows attestation are not implemented, so enforcement is off
      by default.** Only the Android companion collects a digest; the desktop shells
      and the browser host send no attestation, and `require_attestation: true` would
      block a registered app's own deeplinks there. With it off, identity is resolved
      and impersonation is still blocked, but an unattested app falls back to the
      forgeable name match for its allow-list. Both modes are exercised by the
      corpus (`app_unattested_deeplink` vs `benign_registered_app_unattested`).

  - id: agentscan-image-forgery
    paper: agentscan
    section: "GUI layer"
    name: Image forgery for app identity (cloned icon + name)
    paper_result: "10/10 (100%) on 3 agents"
    status: partial
    mechanism: >
      `guard_schema::visual` + `APP-LOOKALIKE` (iteration 19). The appearance an app presents —
      its `PackageManager` label and a 64-bit difference hash of its icon — is compared against
      the registry's declared `labels:` / `icon_dhash:`, and a match against a registered app the
      package *is not* is the finding. The label is folded first (invisibles and combining marks
      dropped, full-width narrowed, Cyrillic/Greek/precomposed Latin mapped to base letters,
      digit-leet where a digit stands between two letters), so `Wе-Сhаt`, `ＷｅＣｈａｔ`, `Wéchat`
      and `W3Chat` all resolve to WeChat.

      Direction is the whole design: appearance is the accusation, the signing certificate is the
      authority. Matching an icon never makes an app that app. `OwnIdentity` carries *how* the
      package's own registered name is known — verified, merely claimed, or disproven — because
      reading it from the unverified package→name map let a clone forge `com.tencent.mm` as well
      as the face and be excused by "its own" entry. Each channel is excused only by its own
      channel matching the own entry, so keeping one of your faces does not silence a clone of
      the other.

      Label evidence blocks (Critical). Icon-only evidence is **advisory** — `LogOnly`, recorded
      and never surfaced — because the perceptual channel's false-match rate is measured at 6.6%
      over unrelated simple icons. `APP-FACE-UNPROVEN` reports an unproved claim to a registered
      face; `APP-FACE-UNREADABLE` reports that the appearance could not be read at all, so an
      inert check is distinguishable from a clean one.
    # `APP-LOOKALIKE`, `APP-FACE-UNPROVEN` and `APP-FACE-UNREADABLE` are engine-emitted, not YAML
    # rules, so they are named in the mechanism text rather than claimed here — same as
    # FW-BREAKOUT and FW-TEXT-ANOMALY.
    rules: []
    scenarios:
      - lookalike_cloned_app
      - lookalike_folded_label
      - lookalike_cloned_icon_only
      - benign_lookalike_real_app_unattested
      - benign_lookalike_neighbouring_names
    note: >
      Held at `partial`, and the limits are load-bearing rather than decorative.

      **Android only, and bounded by package visibility.** The check runs only when an event
      carries a `package`; macOS, Windows and the browser adapter send none and it does not run
      there at all. On Android it depends on `PackageManager` being able to see the *observed*
      package, and a clone is by construction not one of the registered packages — so the
      companion needs a MAIN/LAUNCHER `<queries>` entry, which it now has, with the privacy trade
      stated in the manifest. None of that is verified on a device: this repo has no Android CI.

      **The hash is a tripwire for exact clones, and cannot intervene.** Measured over 30 generated glyphs in
      the dominant real style (28 comparable), by a test in `guard-schema` so the figures are
      reproducible from the artifact, unrelated-pair distances run 0–27 (not "near 32"), 6.6% of pairs
      are within 4 bits, and four pairs hash identically because an 8x8 grid cannot resolve one
      stroke; the same icon hashed by two producers diverges by up to 4 bits. The distributions
      overlap, so no threshold separates them, and widening to 256 bits was measured and does not
      fix it. Hence icon-only evidence is LogOnly, and
      `lookalike_cloned_icon_only_001` is kept as an attack the corpus counts as a **miss** —
      attack_miss_rate is 1.1%, not 0.0%.

      **Containment is not a match**, so a clone named "WeChat Pay" escapes the label rule; 企业微信
      / WeChat Work is a real different app whose name contains a registered one. **Only two typo
      shapes** (adjacent transposition, doubled letter) are matched: a general one-edit rule made
      Stride, Strive, Stripes, Stripo, Strip, WebChat and Elemi into Critical blocks. **Four-letter
      Latin names are below the information floor**, so the registry's own AMap is not protectable
      by label.

      **A forged package name still collapses this to §3.5's unsolved case.** With no attestation,
      an app claiming `com.tencent.mm` and wearing WeChat's face is indistinguishable from WeChat;
      the guard reports `APP-FACE-UNPROVEN` rather than calling it consistent, and that is the most
      it can do without an authority.

      **The registry is fixtures**, and an `icon_dhash` is an accusation template rather than a
      fail-closed pin — a wrong one accuses an innocent app. **The Kotlin producer has no test**:
      `AppFace.hashGrid` reimplements the pinned algorithm and this repo has no JVM test target.

  - id: agentscan-glitch-tokens
    paper: agentscan
    section: "LLM layer"
    name: Glitch tokens
    paper_result: "5 agents (1–4/10); listed as unresolved in the paper"
    status: partial
    mechanism: >
      guard-privacy anomaly.rs, scanned per event over the same OBSERVED_TEXT_KEYS the
      semantic firewall uses, reported as FW-TEXT-ANOMALY (Alert/Medium, knob
      on_text_anomaly). Six classes: invisible_text (zero-width, soft hyphen, Unicode tag
      block), bidi_override (U+202A-202E, U+2066-2069 — not the plain LTR/RTL marks),
      homoglyph (a predominantly Latin word carrying Cyrillic or Greek), combining_stack
      (three or more), oversized_token (>256 chars unbroken), glitch_token (published list).
      Findings carry a class and a count, never the text. Single pass, no regex.
    # `FW-TEXT-ANOMALY` is engine-emitted, not a YAML rule, so it is named in the mechanism
    # text rather than claimed here — the same as FW-BREAKOUT on the semantic-firewall
    # surface. The coverage validator is right to reject a claim on a rule that does not
    # exist in the ruleset.
    rules: []
    scenarios:
      - glitch_invisible_instruction
      - glitch_homoglyph_button
      - benign_glitch_multilingual_ui
    note: >
      `partial`, and the split between the two halves is the honest part.

      The **structural** half does not depend on knowing the model, and is what carries the
      surface: invisible characters (zero-width, soft hyphen, and the Unicode tag block that
      is today's invisible-prompt-injection vehicle), bidi *overrides* (Trojan Source),
      Latin words carrying Cyrillic or Greek lookalikes, combining stacks, and oversized
      tokens. The unifying property is a divergence between what a screen *renders* and what
      an agent *reads* — worth a finding on its own, because every other check in this engine
      reasons about the text as a string while the user reasons about it as pixels.

      The **glitch-token** half is a tripwire, not coverage. A glitch token is a property of
      one tokenizer's training data; ` SolidGoldMagikarp` is famous because of what GPT-2's
      BPE did with it, and the equivalent for another model is a string nobody has published.
      The list is a snapshot of public research and an attacker who reads it picks something
      else. AgentScan lists this class as unresolved, and a curated list does not resolve it.

      Precision took two passes. The first version fired on ZWJ emoji (15/15 tested — every
      family and profession emoji uses U+200D), subdivision flag emoji (which are *tag
      sequences*, so "the tag block has no legitimate use in UI text" was wrong), Persian
      ZWNJ (grammatically required), German soft hyphens, ICU/Fluent FSI…PDI interpolation
      wrappers (every localised app), real JWTs and data: URLs over the 256-char token
      threshold, and Greek letters used as engineering notation (Δt, μs, Ω). It also had no
      latch, so forty identical UI deltas produced forty alerts — the lesson this codebase had
      already written down for APP-UNATTESTED. And the 0.0% false-positive figure was measured
      on a corpus containing no emoji, no ZWNJ, no soft hyphen, no bidi isolate and no long
      token at all. All of that is fixed: ZWJ/ZWNJ/soft-hyphen removed, tag runs after U+1F3F4
      skipped, bidi narrowed to the two overrides, threshold 2048, Greek dropped, and the
      finding reported once per class per session at Low severity.

      Two further corrections worth recording. `FW-TEXT-ANOMALY` at Medium **replaced** any
      Alert/Low or LogOnly verdict it merged with, so one zero-width character erased a latched
      APP-UNATTESTED, AGENT-SESSION-MISMATCH or FLOW-DERIVE — permanently, since those latch
      per session; `merge_keeping_reason` now keeps both reasons whichever wins. And the
      combining-stack threshold was justified by scripts (Devanagari, Thai) whose marks
      `is_combining` does not even list, so it works for Zalgo-style stacking and nothing else
      — stated rather than quietly extended, because a per-script threshold is its own piece
      of work.

      Not covered: an *image* of anomalous text (that is agentscan-image-forgery), and
      anomalies in fields no adapter sends.

  - id: agentscan-log-leakage
    paper: agentscan
    section: "System layer"
    name: Log leakage
    paper_result: "3 agents vulnerable"
    status: partial
    mechanism: >
      Two halves. (1) Our own egress: `guard_privacy::log_safe` / `log_excerpt` in Rust and
      `LogSafe` in Kotlin, applied at every sink that carries observed text — the Android
      companion's `Log.d(envelope)` (which used to write the full JSON of every
      accessibility batch, raw node text included, to logcat unconditionally: the guard was
      the leak on the one platform where the attack applies), its env-survey log line and
      its persisted risk excerpt; and on the Rust side the `StdinConfirm` prompt,
      `sim-capture`/`replay`, `audit-report` and `flow-eval` — on top of iteration 16's
      masking of `AuditRecord::event_json`. Redaction happens where the data is
      *constructed* for the two sinks a source scanner cannot see (`ConfirmRequest`,
      `SessionReport`) rather than at the print site. Display masking is stricter than audit masking (every
      unseparated digit run over 8, every email local part, checksum or not) because a
      console line is not evidence; dates, prices and prose stay readable so the logs
      remain usable. `no_print_sink_emits_observed_text_unredacted` scans every .rs file
      under crates/, adapters/ and apps/ and fails when a print sink touching observed
      text does not go through the redactor — it found a fifth sink nobody had listed.
      (2) Who can read the rest: the Android survey's `logReaders` enumerates packages
      holding READ_LOGS, confirmed with `checkPermission` rather than trusting a manifest
      request, and ENV-LOG-READABLE reports them at Low on their own rule —
      `EnvRisk::log_is_readable()` is deliberately separate from `input_is_observed()`.
      Writing the new marker also exposed that markers were forgeable from screen text
      (a page rendering `[AG_BROADCAST_INPUT_SINK]` produced an ENV-A5 Critical block), so
      `Rule::event_types` now scopes the ENV rules to environment_survey events.
    rules: [ENV-LOG-READABLE]
    scenarios:
      - log_reader_present
      - log_reader_no_marker
      - benign_log_check_unavailable
      - env_marker_forged_by_page
    note: >
      `partial`, and the gaps are structural.

      (0) **The Rust redactors protect developer commands, not users.** `StdinConfirm` is
      never constructed in this repo and the other four Rust sinks are CLI commands; no
      shipping desktop or extension path calls `log_safe`. What protects a user today is the
      Kotlin `LogSafe` on the companion and the audit-row masking from iteration 16. The
      first version of this entry implied otherwise, and the doc claimed the Rust
      `println!`s land in logcat — they do not; the companion does not link the engine.

      (1) **No logcat monitoring.** The paper's framing is an agent leaking *into* the log.
      We report who can read it and we stop contributing to it; we do not read logcat to see
      what the agent put there — and we cannot: READ_LOGS is signature|privileged, so the
      check we would need is the permission we are warning about.

      (2) **The Kotlin half is untested on device, and mostly inert on API 30+.**
      `logReaders` compiles against the SDK and is wired through PayloadSerializer, as
      AppAttestor was in iteration 13, but no CI here runs an Android instrumentation test.
      Worse for the claim: from API 30 `getInstalledPackages` only returns *visible*
      packages and the companion deliberately does not request QUERY_ALL_PACKAGES, so on a
      current device the list is empty because the survey could not look. That is now
      carried explicitly — `log_readers_enumerable` defaults to false, the clean verdict
      says the check did not run, and it does not alert (an unavailable check is not a
      finding). The check becomes real only with QUERY_ALL_PACKAGES, a deployment decision
      with its own privacy cost. The half that works everywhere is the redaction of our own
      egress.

      (3) **Redaction is not encryption.** A masked row still says a payment card was on
      screen at a time in an app. That is deliberate — it is evidence — but a deployment
      treating the audit database as non-sensitive is making a mistake this does not fix.
      SQLCipher via AGENTGUARD_AUDIT_KEY is that answer and is off by default.

      (4) **The source scanner is a regression guard, not a proof.** It cannot see an alias,
      a non-print sink (tracing, a file write), or a field name added later. The robust fix
      is a redacting newtype, which the `HashMap<String, String>` event metadata gives
      nothing to hang on to.

      (5) **An environment survey is still forgeable by any local caller.** Scoping the ENV
      rules to `environment_survey` events stops a *page* from forging one; nothing verifies
      the event came from the companion, so `api-serve`'s /v1/events (bearer token) or the
      FFI (no auth) can forge one in either direction — including a clean survey that clears
      a latched Critical risk. Signing adapter assertions the way agents sign session
      attestations (iteration 15) is the fix and is not built.

      (6) **Content markers are still forgeable.** Only the ENV rules are event-scoped.
      `[AG_TRANSPARENT_OVERLAY]`, `[AG_STEGO_LSB]` and `[AG_UI_REVALIDATE]` match on any
      event type — content is what they are about — so a page can still claim there is an
      overlay. The general fix is a separate metadata channel for adapter assertions rather
      than smuggling them through ui_text; that is a schema change across four adapters and
      is not built.

  - id: agentscan-malicious-instructions
    paper: agentscan
    section: "LLM layer"
    name: Malicious instructions / malicious domains
    paper_result: "multiple agents vulnerable"
    status: covered
    mechanism: "Threat-intel domain + injection matching, Ed25519-signed bundle"
    rules: [CRIT-004, PRIV-005]
