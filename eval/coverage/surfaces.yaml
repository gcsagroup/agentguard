  # ---------------------------------------------------------------- Aura
  - id: aura-i-identity
    paper: aura
    section: "4.1"
    name: "Pillar i: agent identity registry / attestation"
    paper_result: "design proposal (no attack numbers)"
    status: partial
    mechanism: >
      Agent identity cards in policies/agent-registry.yaml, each pinning an Ed25519
      public key. An agent proves it holds the matching private key by signing a
      length-prefixed session-start payload binding agent_id, the session id the
      transport carries, task_profile and a fresh nonce; the session is then
      attributable to that agent, in the audit record's own `attributed_agent`
      column, which chain::canonical_content covers. A forged signature is
      AGENT-BAD-SIGNATURE, a re-presented one AGENT-REPLAY, one presented for another
      session AGENT-BAD-SIGNATURE (agent_session_substitution), one presented for a
      session id that names nothing AGENT-SESSION-UNANCHORED, and an event — or an end
      event — from another session AGENT-SESSION-MISMATCH, and a card may restrict which task
      profiles it declares (AGENT-TASK-NOT-PERMITTED) — matched exactly, so a card and
      the trajectory plan library agree on what the same task is. `agentguard
      agent-keygen` / `agent-attest` are the operator and integration tools. The
      third-party *app* half of this pillar is agentscan-package-forgery.
    rules: []
    scenarios:
      - agent_forged_attestation
      - agent_replayed_attestation
      - agent_session_substitution
      - agent_task_not_on_card
      - agent_unattested_when_required
    note: >
      `partial`, and the remaining gaps are structural.

      (1) **Only the session start is signed.** Signing every event would put an
      Ed25519 operation on the accessibility hot path and no adapter can do it today,
      so an attacker able to inject events into an already-attested session inherits
      its attribution. The same shape of boundary as the app attestor's, and the reason
      §4.4.6's "attribute each *action*" is only half met: attribution is per session,
      not per action.

      (2) **No mutual attestation.** The agent proves itself to the guard; the guard
      does not prove itself to the agent, so an agent cannot tell a real guard from a
      shim that approves everything.

      (3) **Replay defence is per-process and bounded.** Consumed nonces live in
      memory, so restarting api-serve forgets them and the nm-host — one invocation per
      message — never had them; the window holds the most recent 8192, and eviction
      beyond it re-admits an old attestation. A persisted nonce store is the fix and is
      not built.

      (4) **An event with no session id of its own is attributed to whatever the
      engine attested.** Attribution is refused for an event naming a *different*
      session (and reported once as AGENT-SESSION-MISMATCH), but most adapters tag no
      session at all, and one Engine is conceptually one session's guard while
      api-serve shares a single Mutex<Engine> across callers. A per-session engine is
      the fix and is not built.

      Two claims this note previously made were wrong and are worth recording. It
      advertised "audit records carry the attribution inside their hashed content" as a
      strength while the attribution lived in `human_message` — a field many rule
      messages build from event text — so any event could write an attribution for an
      agent it had no key for, into an anonymous session, and have it hashed and signed
      as authentic. And it framed the gap as "an attacker able to inject events into an
      *already-attested* session inherits its attribution", when an ended session also
      still lent its own: `agent_session_end` cleared the task allowlist and the task
      profile but not the identity. Both are fixed (typed `attributed_agent` column;
      identity cleared at session end and checked against the event's session), and
      both were found by review rather than by the corpus.

      Two of the rule ids above are **not** exercised by the corpus, and the corpus
      cannot exercise them: the eval runner tags every event in a scenario with that
      scenario's id, so it cannot express an event belonging to another session
      (AGENT-SESSION-MISMATCH) or one belonging to none (AGENT-SESSION-UNANCHORED).
      They are proven by unit tests instead — `events_from_another_session_are_not_attributed`,
      `a_foreign_end_cannot_close_an_attested_session`, `an_invisible_session_id_is_not_an_anchor` —
      and named here rather than left to look like corpus coverage.

      Also: `require_attestation` is off in the shipped registry because no adapter
      signs a session yet — with it off, a forged or replayed attestation is still
      refused, but an unsigned session proceeds. The shipped keys are fixtures whose
      private halves are in the repo; a test asserts the registry says so.

  - id: aura-ii-semantic-firewall
    paper: aura
    section: "4.2"
    name: "Pillar ii: semantic firewall (origin tagging, NER PII, context isolation)"
    paper_result: "design proposal"
    status: partial
    mechanism: >
      Two halves, in guard-privacy. (1) Structural entity recognition
      (entity.rs): Luhn-verified payment cards, mod-97 IBANs, ISO 7064 PRC resident
      ids, prefixed API secrets and PEM keys, RFC-shaped emails, E.164 or
      keyword-gated phone numbers, and keyword-gated SSN / passport / date-of-birth.
      Checksum-verified recognition feeds the ingest label
      (`ingest_untrusted_value`), so content is at least as sensitive as the most
      sensitive *verified* thing in it — previously a screen full of card numbers was
      ingested at Public because only declared `profile_key`s carried tiers. Shape- and
      keyword-only evidence is reported but never moves a label, so a guess cannot
      block traffic. Findings are redacted (class + masked tail, never the value, not
      even a secret's length), and `persist_audit` masks the observed-text fields of
      the stored event too — `event_json` keeps the whole event inside the hash chain,
      so the finding's redaction alone left the PAN in a signed row. (2) Origin-tagged context isolation (isolation.rs):
      `ContentOrigin` with two Verified origins and four Tainted ones, `wrap` with
      total markup escaping so content cannot close its own envelope or claim a
      higher-trust one, and `detect_breakout` for content that closes/forges an
      envelope or forges a conversation turn (`<|im_start|>`, `### System:`,
      `[INST]`). `agentguard isolate` / `scan-content` expose both to a host.
      Hand-written linear scanners, no regex: this runs on the accessibility hot path
      over attacker-controlled text, where a backtracking regex is a DoS surface.
    rules: [OVL-004, PRIV-003]
    scenarios:
      - inject_system_override_block
      - fw_card_on_screen_exfil
      - fw_role_marker_breakout
      - fw_envelope_breakout
    note: >
      `partial`, and the three gaps are structural rather than a matter of adding
      patterns.

      (1) **This is not NER.** There is no model. It recognises entities with
      *structure* — a checksum, an issuer prefix, a keyword next to a shape — and
      therefore cannot recognise the classes whose only signal is linguistic: a
      person's name, a street address, an employer, a medical condition. Where a
      checksum exists the finding is verified, which is what keeps it from alerting on
      every 16-digit order number; where none exists (SSN, passport, DOB) the entity is
      marked unverified and gated on a keyword, and is weaker evidence.

      (2) **Isolation cannot be enforced, only offered.** AgentGuard does not assemble
      the agent's prompt, so `wrap` is a primitive a host calls and the guard cannot
      tell whether it did. The enforced half is detection of breakout attempts in
      observed content, which needs nothing from the host. `on_context_breakout` is
      Alert by default for the same reason: whether those bytes are an attack or inert
      depends on the host's assembly, so the guard names them and lets the taint
      lattice refuse the critical action either way.

      (3) **Values are not observed, screens are.** No shipped adapter transmits form
      field *values* — only `field_id` / `profile_key` / `value_filled`. So entity
      recognition sees what an app rendered, not what the agent typed, and the
      `order_note`-with-a-passport case is caught only when the app also displays it.

      (4) **The label raise has no shipped producer.** It runs from
      `ingest_untrusted_value`, which needs `value_id` on the event, and no adapter, app,
      FFI caller or extension emits one — the whole flow lattice is in that position (see
      aura-iii-taint). So the raise is live for hosts integrating the lattice directly and
      for the corpus; the half that runs on every real event is FW-BREAKOUT, which needs
      only ui_text.

      (5) **Encoding evasions defeat entity recognition.** A PAN whose groups are
      separated by a non-breaking space (the normal rendering of `&nbsp;`-grouped card
      numbers), a double space, a newline, a tab, a full stop, an en dash, a zero-width
      joiner — or written in full-width or Arabic-indic digits — is not recognised.
      `detect_breakout` normalises its input; `recognise` does not.

      Also worth recording, because the note previously implied otherwise: the aggregate
      "attack miss rate 0.0%" does not certify this surface. With the label raise removed,
      fw_card_on_screen_exfil still counts as intervened on an unrelated Alert while the
      exfiltration succeeds; the check that carries the claim is that scenario's explicit
      decision_must_block FLOW-CONF. And a keyword false positive cannot fail any scenario,
      because unverified evidence never blocks — that precision is pinned by unit tests
      only.

  - id: aura-iii-taint
    paper: aura
    section: "4.3.1"
    name: "Pillar iii: taint lattice, inheritance, declassification"
    paper_result: "design proposal"
    status: partial
    mechanism: >
      guard-privacy TaintLattice: ⟨integrity, confidentiality⟩ labels with join,
      dependency inheritance via data_derive, memory labels keyed by memory key,
      Aura's No-Write-Down (FLOW-NWD: tainted content into a Critical Node), our
      own confidentiality rule (FLOW-CONF), and HITL declassification applied only
      by the confirm gate (FLOW-DECLASSIFY-REQUEST → approve, or
      FLOW-DECLASSIFY-BAD). Cross-app pivoting (PRIV-XAPP) is enforced through
      on_confidentiality_downgrade rather than being a hardcoded alert.
    rules: []
    scenarios:
      - flow_derived_value_exfil
      - flow_memory_laundering
      - flow_untrusted_drives_payment
      - flow_declassify_self_approved
      - flow_declassify_not_a_downgrade
      - xapp_taint_pivot
    note: >
      Held to `partial`, not `covered`, and the reasons are structural rather than
      cosmetic.

      (1) Labels only track values AgentGuard is *told* about. An agent that reads a
      value off the screen and retypes it from its own context window, emitting no
      data_derive, is invisible. This is flow control over *declared* flows, not a
      sandbox — see docs/scope-and-non-goals.md.

      (2) Aura requires the tag be "cryptographically bound to the content
      throughout its lifecycle". Ours is a HashMap from memory key to value id
      inside one process: it survives a save/load round trip, and nothing more. A
      host that writes to its own store without emitting the event, or restarts,
      loses the binding.

      (3) Sink clearance is inferred from the session's `task_apps` declaration and
      an exact name match — not from a verified app identity. A malicious app that
      registers the declared name still inherits its clearance. That is the §3.5 /
      pillar-i gap and is still open.

      (4) `sink_kind` and the sink name itself are still taken from the event. The
      *clearance ceiling* is no longer negotiable by the event, but an agent that
      mislabels a network egress as an app_field gets the app_field ceiling. Closing
      this needs the adapter, not the policy, to classify the sink.

  - id: aura-iii-trajectory
    paper: aura
    section: "4.3.2"
    name: "Pillar iii: plan-trajectory alignment"
    paper_result: "design proposal"
    status: partial
    mechanism: >
      guard-core Trajectory: the executed steps A₁…Aₜ are recorded and each candidate
      step is justified against the task's plan from policies/task-plans.yaml — scope
      (PLAN-OUT-OF-SCOPE), budget (PLAN-OVER-BUDGET), ordering (PLAN-OUT-OF-ORDER),
      completion (PLAN-AFTER-COMPLETION) — plus a cumulative drift score, a latch
      until human re-anchoring (PLAN-UNANCHORED), and a missing-plan report
      (PLAN-MISSING). Step kinds are derived from the events the adapters already
      send, so no adapter change is required. The old TASK-DRIFT label comparison is
      kept for the no-library case.
    rules: []
    scenarios:
      - plan_second_payment
      - plan_out_of_scope_shell
      - plan_out_of_order_payment
      - plan_drift_latches
      - plan_missing_fails_closed
      - plan_payment_hidden_by_marker
      - plan_session_restart_amnesty
      - task_drift_alert
    note: >
      `partial`, and the gap is the important half of the paper's design.

      (1) **No per-action justification against the instruction.** Aura's check is a
      model call: does this action make sense given what the user asked? Ours is
      structural conformance to a plan an operator wrote — scope, count, order,
      completion. That catches the label-preserving drift the old string comparison
      missed, and it needs no model, but it is a weaker claim and cannot judge an
      action the plan happens to permit for a purpose the user never had.

      (2) **The plan is a step-kind grammar, not a trajectory model.** There is no
      notion of *which* room was booked or *whose* card was used, so an agent that
      books the wrong hotel conforms perfectly.

      (3) **Alert by default** (`on_plan_drift`). A new plan library is the easiest
      thing here to get wrong in the direction that costs users their work: an
      over-strict order clause stops a real booking mid-flow. Alerting first lets an
      operator see what their plans reject before it costs anyone a task.

      (4) **`require_plan: false` by default**, so a profile nobody has planned runs
      unconstrained after a one-time report. Failing closed would block every profile
      an operator has not yet written, which means the library never gets adopted.

      (5) **A step kind a rule does not declare is invisible to a budget.** Payments
      are enforceable because CRIT-001/CRIT-002 carry `step_kind:`; a deployment that
      writes its own rules for a critical action and omits the annotation gets a plan
      that reads as a constraint and counts nothing. A test asserts the shipped rules
      and plans agree, but nothing checks an operator's.

