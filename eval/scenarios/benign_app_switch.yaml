scenario_id: benign_app_switch_001
kind: benign
reference: false-positive-control-a4
platform: [macos]
task_profile: browse
goal: >
  The whole screen changes because the user switched apps. This is precisely what
  the old mean-luma A4 detector fired on, so it is the control that keeps the new
  digest comparison honest: a global repaint must not be reported as tampering.
events:
  - event_type: process_focus
    source_app: Safari
    metadata: {}
  - event_type: ui_tree_delta
    source_app: Safari
    metadata:
      ui_text: "Reading list — Safari"
verification:
  - type: no_intervention
agent_under_test: auto
