scenario_id: benign_glitch_multilingual_ui_001
kind: benign
reference: false-positive-control-text-anomaly
platform: [macos, windows, android, browser]
goal: >
  False-positive control for the text-anomaly check, and the reason it can ship.

  The Chinese here says "order confirmed", not "confirm payment": the first draft used
  确认支付 and correctly tripped `CRIT-001`, which would have made this control pass or fail
  for a reason having nothing to do with text anomalies.

  One screen of ordinary multilingual UI text: Chinese with a Latin brand name, Japanese
  kana beside `Booking.com`, Vietnamese diacritics, Devanagari, Arabic and Hebrew carrying
  the plain right-to-left **marks**, a JWT and a SHA-256 digest.

  And, after a reviewer found every one of these firing, the characters a *renderer* needs:
  a **ZWJ family emoji**, a **subdivision flag** (which is a tag sequence, so the tag block
  does have a legitimate use), **Persian ZWNJ** (grammatically required), **German soft
  hyphens**, an **ICU/Fluent FSI…PDI interpolation wrapper** (every localised app on earth),
  **emoji presentation selectors**, and **Greek letters as engineering notation** (`Δtime`,
  `μsec`, `Ωmeter`). The first version of this control contained none of them — so the
  reported 0.0% false-positive rate was measured on a corpus that excluded every class that
  actually fires. The exact-threshold token claim was false too: nothing in it exceeded 64
  characters, and both boundaries are now pinned by unit tests instead.

  Every one of these is what a naïve version of this check fires on. Mixed scripts are
  normal — a Latin brand inside a Chinese sentence is every second screen in this corpus —
  so the homoglyph rule is scoped to predominantly Latin words carrying Cyrillic or Greek;
  `U+200E`/`U+200F` are ordinary in every RTL interface, so only the reordering *overrides*
  count; Vietnamese stacks two combining marks, so three is the threshold. A check that
  alerts on this screen is switched off in a week, and then protects nothing.
events:
  - event_type: ui_tree_delta
    source_app: Booking
    metadata:
      value_id: v_multi
      ui_text: "订单已确认 — Mum 👨‍👩‍👧 — 🏴󠁧󠁢󠁳󠁣󠁴󠁿 — می‌خواهم — Ver\u00adtrags\u00adbe\u00addin\u00adgun\u00adgen — Willkommen zurück, \u2068Sara\u2069! — ☀️ 26°C ⚠️ — Show Δtime, 250 μsec, Ωmeter — 订单已确认 ¥128.00 — Grand Hotel 上海 — こんにちは Booking.com — Xin chào, Đặt phòng thành công — नमस्ते बुकिंग — \u200fمرحبا بالعالم\u200e — \u200fשלום עולם — eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9 — 9f2a4c1e8b7d6a5f4e3c2b1a0987654321fedcba9f2a4c1e8b7d6a5f4e3c2b1a"
