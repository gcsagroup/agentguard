<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F4/F5 · DNR 网络硬阻断</title>
<style>
  body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 20px}
  button{font-size:15px;padding:9px 14px;margin:6px 8px 6px 0;border:1px solid #ccc;border-radius:8px;background:#f5f5f5;cursor:pointer}
  #log{margin-top:16px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px;background:#f0f0f0;padding:12px;border-radius:8px;min-height:60px}
</style>
</head>
<body>
<h1>F4 / F5 · 浏览器 DNR 网络硬阻断</h1>
<p>每个控件向同源假路径发请求(本地服务器会回 501,不会真付款)。付款形状的非 GET/HEAD 请求应由
浏览器静态 DNR 直接阻断，不弹“允许一次”；普通请求与付款路径 GET 应直达测试服务器。</p>

<button id="fetch-pay" data-url="/pay/checkout" data-method="POST">POST /pay/checkout(fetch → 硬拦)</button>
<button id="xhr-pay">POST /payment/xhr(XHR → 硬拦)</button>
<button id="beacon-pay">POST /checkout/beacon(beacon → 硬拦)</button>
<button data-url="/pay/status" data-method="GET">GET /pay/status(只读 → 不应拦)</button>
<button data-url="/api/search" data-method="POST">POST /api/search(普通 → 不应拦)</button>

<form id="form-pay" action="/charge/form" method="post" target="form-sink">
  <button type="submit">Submit fixture(form POST → 硬拦)</button>
</form>
<iframe name="form-sink" title="form fixture sink" hidden></iframe>

<div id="log">日志:</div>

<script>
  const log = (m) => { document.getElementById("log").textContent += "\n" + m; };
  document.querySelectorAll("button[data-url]").forEach((b) => {
    b.addEventListener("click", async () => {
      const url = b.dataset.url, method = b.dataset.method;
      log(`发起 ${method} ${url} …`);
      try {
        const r = await fetch(url, { method });
        log(`  → 完成:HTTP ${r.status}(请求确实发出去了)`);
      } catch (e) {
        // 被门拒绝会 reject(AbortError);网络失败也会 reject —— 看 Network 面板区分。
        log(`  → 被拒绝 / 未发出:${e && e.name}: ${e && e.message}`);
      }
    });
  });

  document.getElementById("xhr-pay").addEventListener("click", () => {
    log("发起 POST /payment/xhr …");
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/payment/xhr");
    xhr.onload = () => log(`  → XHR 完成:HTTP ${xhr.status}`);
    xhr.onerror = () => log("  → XHR 被浏览器阻断");
    xhr.onabort = () => log("  → XHR 已中止");
    xhr.send("fixture=1");
  });

  document.getElementById("beacon-pay").addEventListener("click", () => {
    const accepted = navigator.sendBeacon("/checkout/beacon", "fixture=1");
    log(`发起 beacon /checkout/beacon，浏览器入队=${accepted}`);
  });

  document.getElementById("form-pay").addEventListener("submit", () => {
    log("发起 form POST /charge/form …");
  });
</script>
</body>
</html>
