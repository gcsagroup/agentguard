# 面向用户的能力声明 → 兑现代码 + 证明测试(X-2)
#
# 见 crates/guard-eval/src/capability_claims.rs 的模块文档,以及 docs/主张与测试映射.md。
#
# 被机器核对的两件硬事实:
#   1. source.anchor 必须作为子串出现在 source.doc 里(声明真的印在那份用户可见文档里);
#   2. proven_by 里每条 `fn <test>(` 必须出现在 file 里(证明测试真的存在)。
# mechanism 是描述性的,不被机器核对——钉住"能力还在"的是那条测试。
#
# 这张表是**人工维护**的,不能自动发现新的用户声明(那要 NLP 抽取,见模块文档的"边界")。
# 覆盖的是最能被单条声明直接兑现、且有强证明测试的能力;尚未映射的用户声明是显式残余,
# 见 docs/主张与测试映射.md §残余。

version: 1
claims:
  - id: audit-tamper-evident
    claim: 签名、防篡改的审计轨迹——改一行并重算哈希链,签名仍然戳穿它
    area: audit
    source:
      doc: apps/extension-chromium/STORE.en.md
      anchor: "signed, tamper-evident audit chain"
    mechanism: guard-audit 每行 Ed25519 签名 + 哈希链;verify 从行重算哈希而非信列里的值
    proven_by:
      - { test: rehashed_tamper_passes_chain_but_fails_signatures, file: crates/guard-audit/src/store.rs }
    note: 见 scripts/audit-signing-demo.sh 的六条篡改路径;截尾要靠带外头见证(check_inclusion)

  - id: intel-signed-ed25519
    claim: 威胁情报更新是签名的(Ed25519),给了公钥就拒未签名 / sha256 降级
    area: intel
    source:
      doc: apps/extension-chromium/STORE.en.md
      anchor: "Threat intel updates are signed (Ed25519)"
    mechanism: guard-intel::verify;给公钥即要求真实性,sha256/未签名一律拒
    proven_by:
      - { test: 有公钥时拒绝未签名, file: crates/guard-intel/src/lib.rs }
      - { test: 有公钥时拒绝sha256冒充签名, file: crates/guard-intel/src/lib.rs }
    note: 残余:发布注册表私钥是仓库夹具(公开),发布前必须 intel-keygen 换掉(preflight 盯着)

  - id: stego-subliminal-text
    claim: 检测隐藏 / 潜意识的提示注入文本
    area: vision
    source:
      doc: apps/extension-chromium/STORE.en.md
      anchor: "hidden / subliminal prompt-injection text"
    mechanism: guard-vision::stego 全行扫描 LSB / chroma+luma 隐写
    proven_by:
      - { test: 真正的lsb隐写仍然被抓到, file: crates/guard-vision/src/stego.rs }
      - { test: 避开采样行的隐写仍被抓到, file: crates/guard-vision/src/stego.rs }
    note: 密度地板:极稀疏的隐写率会低于检测阈值,这是速率检测器的固有限

  - id: frame-repaint-vs-tamper
    claim: 逐帧摘要区分整屏重绘与局部篡改
    area: vision
    source:
      doc: docs/platform-matrix.md
      anchor: "subliminal bands, chroma+luma stego, frame digest"
    mechanism: guard-vision::framehash 残差聚类,减去每平面中位偏移后再判
    proven_by:
      - { test: app_switch_is_a_global_repaint_not_a_tamper, file: crates/guard-vision/src/framehash.rs }

  - id: android-app-attestation
    claim: Android 借 PackageManager 收集签名者 SHA-256 做应用鉴真
    area: android
    source:
      doc: docs/platform-matrix.md
      anchor: "`PackageManager` signer SHA-256"
    mechanism: android-adapter 转发 signer_sha256 / attest_error;引擎按签名者钉扎判决
    proven_by:
      - { test: attest_error_is_forwarded_and_blanks_are_not, file: adapters/android-adapter/src/lib.rs }

  - id: android-lookalike
    claim: Android 冒名检测:标签 + 图标 dHash
    area: android
    source:
      doc: docs/platform-matrix.md
      anchor: "label + icon dHash"
    mechanism: guard-core APP-LOOKALIKE;标签折叠 + icon_dhash 近似匹配即 Block
    proven_by:
      - { test: a_cloned_label_and_icon_blocks, file: crates/guard-core/src/lib.rs }
      - { test: folded_labels_are_caught, file: crates/guard-core/src/lib.rs }

  - id: android-env-survey
    claim: Android 环境勘察:a11y 服务、广播接收、日志读取
    area: android
    source:
      doc: docs/platform-matrix.md
      anchor: "a11y services, broadcast sinks, log readers"
    mechanism: android-adapter env_survey → 引擎逐项标记(日志读取者本身即一条发现)
    proven_by:
      - { test: hostile_env_survey_emits_both_markers, file: adapters/android-adapter/src/lib.rs }

  - id: critical-notify-not-block
    claim: Critical 判决弹出命名规则的浏览器通知——事后告警,不是阻断式先批后行
    area: browser
    source:
      doc: apps/extension-chromium/STORE.en.md
      anchor: "raises a notification after the fact"
    mechanism: guard-nm-host 为 Block/Critical/require_confirm 判决构造 notify 供扩展弹通知
    proven_by:
      - { test: critical判决产生notify供扩展弹通知, file: crates/guard-nm-host/src/main.rs }
    note: 这条 claim 说的是**宿主 native-messaging 路径**——异步观测,只能事后通知;但页面内的付款/陷阱动作已由 E2 内容脚本同步门在执行前拦(见 browser-preexec-block)。桌面壳子仍是唯一的阻断式模态

  - id: session-scope
    claim: 会话作用域(Aura §4.4):授权在会话开始记录、不越过会话存活
    area: core
    source:
      doc: docs/platform-matrix.md
      anchor: "Session scope (Aura §4.4)"
    mechanism: guard-core 会话开始记 SESSION-START 授权,会话结束授权失效
    proven_by:
      - { test: the_session_grant_is_recorded_at_session_start, file: crates/guard-core/src/lib.rs }
      - { test: the_grant_does_not_outlive_its_session, file: crates/guard-core/src/lib.rs }

  - id: shell-path-sensitive
    claim: 路径模型:对根 / 系统目录的删除(rm -rf / 等)无条件拒绝
    area: shell
    source:
      doc: docs/路径模型.md
      anchor: "SHELL-PATH-SENSITIVE"
    mechanism: guard-shell 无条件敏感目标(/、/etc、~/.ssh …),不依赖任何策略配置即拒
    proven_by:
      - { test: 三_rm_rf_根目录_无条件拒绝, file: crates/guard-shell/src/lib.rs }
      - { test: 二_删根目录_无条件拒绝, file: crates/guard-shell/src/lib.rs }

  - id: fs-scope-engine
    claim: 文件系统天花板由引擎自己执行(授权内放行、授权外 Block、未声明 unscoped 告警)
    area: core
    source:
      doc: docs/路径模型.md
      anchor: "check_filesystem_scope"
    mechanism: guard-core::check_filesystem_scope 区分 FS-OUTSIDE(Block)与 FS-UNSCOPED(Alert)
    proven_by:
      - { test: 声明的写授权内放行授权外拒绝, file: crates/guard-core/src/lib.rs }
      - { test: 未声明paths时仍是unscoped告警, file: crates/guard-core/src/lib.rs }

  - id: localapi-bearer
    claim: 回环 API 要 bearer 令牌,弱令牌 / 示例令牌拒绝启动
    area: localapi
    source:
      doc: docs/local-api.md
      anchor: "AGENTGUARD_API_TOKEN"
    mechanism: guard-localapi 启动期令牌强度检查;非回环绑定默认拒;常数时间比对
    proven_by:
      - { test: 弱令牌不让服务器起来, file: crates/guard-localapi/src/lib.rs }
      - { test: 文档里的示例令牌被点名拒绝, file: crates/guard-localapi/src/lib.rs }

  # ---- E 系列:实时化 / 执行前阻断 / 跨浏览器(本轮新增) ----

  - id: jail-net-egress
    claim: Linux jail 可在内核里强制 TCP 出口天花板(声明才强制、fail-closed)
    area: jail
    source:
      doc: docs/内核约束.md
      anchor: "网络出口天花板"
    mechanism: guard-jail Landlock ABI v4 端口规则;空天花板治理 bind+connect 两类;后端非 Landlock 拒启动
    proven_by:
      - { test: 空网络天花板拒绝一切tcp, file: crates/guard-jail/src/landlock.rs }
      - { test: 声明网络但后端非landlock被拒, file: crates/guard-jail/src/lib.rs }
    note: 只到 TCP 端口、不按主机/IP、不含 UDP;syscall 路径本容器测不到(真机 E2E 未验证)

  - id: browser-preexec-block
    claim: 浏览器扩展在页面动作执行前拦截付款/陷阱提交(不是事后通知)
    area: browser
    source:
      doc: docs/浏览器执行前阻断.md
      anchor: "执行前阻断"
    mechanism: content.js 捕获阶段同步 preventDefault + 本地确认;判决逻辑 guard-gate.js
    proven_by:
      - { test: 付款 CTA 要执行前拦下, file: apps/extension-chromium/scripts/gate.test.mjs }
      - { test: 隐私陷阱 PII 提交要执行前拦下, file: apps/extension-chromium/scripts/gate.test.mjs }
      - { test: 付款按钮允许一次只产生一次确认并提交一次, file: apps/extension-chromium/scripts/content-event.test.mjs }
    note: 只覆盖页面自身 DOM 动作;click→submit 接线有模拟 DOM 事件链测试;MAIN world 的 postMessage 通道可被页面观察/伪造,不能抵抗主动对抗页面;真 Chrome/Firefox E2E 仍未验证

  - id: browser-fetch-gate
    claim: 拦截页面直发的付款形状 fetch/XHR(补上 DOM 门拦不了直接 fetch 的残余)
    area: browser
    source:
      doc: docs/浏览器执行前阻断.md
      anchor: "页面直发的"
    mechanism: guard-page.js(world:MAIN)包裹 fetch/XHR,付款形状请求 await 确认才发
    proven_by:
      - { test: 付款形状的 POST 请求要在发出前拦, file: apps/extension-chromium/scripts/gate.test.mjs }
      - { test: 只读方法不拦(GET/HEAD 不该有副作用), file: apps/extension-chromium/scripts/gate.test.mjs }
    note: MAIN world 里页面与我们平权,早于我们抢到 fetch 的脚本绕得过——尽力而为不是铁壁

  - id: cross-browser-consistency
    claim: Chrome 与 Firefox 装同一套防护,内容脚本/权限不漂移
    area: browser
    source:
      doc: docs/跨浏览器.md
      anchor: "manifests.test.mjs"
    mechanism: manifest.json 与 manifest.firefox.json 由结构测试钉住一致
    proven_by:
      - { test: 两份 manifest 装的是同一套内容脚本文件, file: apps/extension-chromium/scripts/manifests.test.mjs }
    note: Edge 同 Chromium;Safari 是 Xcode 包壳的设计项、不在此列;真机未验证

  - id: engine-to-browser-dnr
    claim: 引擎判决的主机(恶意域 + 越出 scope.hosts 的目的地)会被浏览器在网络层硬拦(判决→DNR)
    area: browser
    source:
      doc: docs/浏览器执行前阻断.md
      anchor: "block_hosts"
    mechanism: guard-nm-host 从 INTEL-DOMAIN / SCOPE-HOST 判决抠主机(共享前缀契约)放进 block_hosts;background.js 装 DNR 规则
    proven_by:
      - { test: 恶意域判决在响应里带上block_hosts, file: crates/guard-nm-host/src/main.rs }
      - { test: 只从恶意域判决抠出要拦的主机, file: crates/guard-nm-host/src/main.rs }
      - { test: 越界目的地也抠出要拦的主机, file: crates/guard-nm-host/src/main.rs }
      - { test: "恶意域累积保留:下一批 benign 判决不会把它清掉", file: apps/extension-chromium/scripts/gate.test.mjs }
      - { test: "越界目的地随会话过期,不永久拦掉用户对该主机的正常访问", file: apps/extension-chromium/scripts/gate.test.mjs }
    note: E8 累积语义——恶意域累积保留(落 storage)、越界随会话过期;SCOPE-HOST 只在声明 hosts 时发;此 DNR 桥的越界只对网络流事件成立,但浏览器侧的越界已由 E9 本地允许表门覆盖(见 browser-local-scope-gate),不再是残余;DNR fail-open;真 Chrome/Firefox E2E 未验证

  - id: browser-local-scope-gate
    claim: 任务允许表下发到浏览器,本地判出站目的地是否越界(不回传 URL,后缀伪造拒同 Rust)
    area: browser
    source:
      doc: docs/浏览器执行前阻断.md
      anchor: "scope_hosts"
    mechanism: nm-host 带 granted_hosts 快照;guard-page.js 本地 scopeGateHost + hostInScope(Rust host_in_scope 的 JS 镜像)
    proven_by:
      - { test: host_in_scope向量表_rust与js同源, file: apps/extension-chromium/scripts/gate.test.mjs }
      - { test: "scopeGateHost:没声明允许表不拦,声明了拦越界,空表全拦", file: apps/extension-chromium/scripts/gate.test.mjs }
      - { test: host_scope_向量表是rust与js的单一真相源, file: crates/guard-schema/src/plan.rs }
    note: 下发的是策略(允许表)不是浏览历史;host_in_scope 由共享向量表(eval/host-scope-vectors.json)钉住 Rust/JS 同源;MAIN world 客户端检查尽力而为;真机未验证

  - id: macos-realtime-tree
    claim: macOS 树观测由 AXObserver 推送驱动,变到抓的延迟有上界(不是纯轮询)
    area: macos
    source:
      doc: docs/macos实时观测.md
      anchor: "AXObserver"
    mechanism: 桌面驱动 50ms tick → AXObserver FFI 推送 → ax_push.rs 合并器(去抖 150ms + 延迟上限 800ms + 3s 兜底)
    proven_by:
      - { test: 延迟上限_持续通知也会强制抓, file: adapters/mac-adapter/src/ax_push.rs }
      - { test: 去抖_安静够了才抓, file: adapters/mac-adapter/src/ax_push.rs }
      - { test: ax_observer_is_wired_into_desktop_driver, file: apps/desktop-macos/src-tauri/src/lib.rs }
    note: 像素捕获仍采样(压小的是树间隙非像素);本机 ad-hoc 候选已验证回调到产品驱动连通,但未做 150ms/800ms 真机延迟分布、签名/公证安装或长时间稳定性验收

  - id: humane-ui-vocabulary
    claim: 用户界面不出现无解释的裸术语——finding 种类/规则 ID 都有三语人话词条,技术标识收进详情
    area: extension
    source:
      doc: docs/消费者化界面.md
      anchor: "人话词典是单一真相源"
    mechanism: guard-strings.js 单一词表;覆盖率测试从 content.js/events.rs 源码提取标识符对词典点名
    proven_by:
      - { test: "content.js 上报的每个 finding kind 在词典里都有三语人话词条", file: apps/extension-chromium/scripts/strings.test.mjs }
      - { test: "guard-schema events.rs 里的每个规则 ID 在词典里都有三语人话词条", file: apps/extension-chromium/scripts/strings.test.mjs }
      - { test: "guard-gate 会执行前阻断的每个 kind,词典都有确认层文案(标题/正文/两种后果)", file: apps/extension-chromium/scripts/strings.test.mjs }
    note: 覆盖率靠源码字面量提取,动态拼接的标识符看不见;翻译质量测试保证不了(见文档边界节)

  - id: protection-state-truthful
    claim: 状态灯只在「会话 + 观察器运行 + 心跳新鲜 + 审计可写」全满足时显示守护中;会话开着但没人在看是「守护不完整」
    area: shells
    source:
      doc: docs/消费者化界面.md
      anchor: "会话开了 ≠ 有人在看"
    mechanism: guard_core::observe_state::derive 纯函数;两个壳子的 get_status 把事实喂给它,前端只信 protection_state
    proven_by:
      - { test: 会话在但观察器没在跑是degraded而不是active, file: crates/guard-core/src/observe_state.rs }
      - { test: 心跳过期是degraded_心跳在ttl边界内仍是active, file: crates/guard-core/src/observe_state.rs }
      - { test: 审计不可写压过启动中且一定不是active, file: crates/guard-core/src/observe_state.rs }
      - { test: 审计写失败留痕为audit_error且写成功后清空, file: crates/guard-core/src/lib.rs }
    note: 状态机输入在壳子里采集;「真机上灯确实随观察器启停变色」由真机验收判定,不是这些测试

  - id: observation-dedup
    claim: 同一语义内容的重复观察 30 秒内只过引擎一次;内容变一个字立刻放行;周期摘要带 repeat_count
    area: shells
    source:
      doc: docs/消费者化界面.md
      anchor: "内容变一个字就是新事件,立刻放行"
    mechanism: guard_core::event_dedup::Aggregator,只挂在 SCK/AX/UIA 轮询路径;易变元数据键不进指纹
    proven_by:
      - { test: 风暴仿真_106秒静止画面从上百条折叠到个位数, file: crates/guard-core/src/event_dedup.rs }
      - { test: 内容变一个字就是新事件_立即放行不等窗口, file: crates/guard-core/src/event_dedup.rs }
      - { test: 每帧必变的数字不进指纹_语义相同即同一指纹, file: crates/guard-core/src/event_dedup.rs }
      - { test: 重复观察被折叠_周期摘要带repeat_count, file: apps/desktop-windows/src-tauri/src/lib.rs }
    note: 折叠只吃一字不差的重复(AX 文本里一个时钟数字变化就是新事件),所以真机上的折叠率取决于画面静止程度

  - id: guard-does-not-observe-itself
    claim: 观察器跳过 AgentGuard 自己的窗口——守卫的仪表盘树里天生有演示威胁文字,交给引擎只会对着镜子告警
    area: shells
    source:
      doc: docs/windows-observation.md
      anchor: "the observer now skips its own process"
    mechanism: UiSnapshot::source_pid(桥如实带 pid)+ is_self_observation();Windows poll_once 整拍跳过并留 SELF_SKIP_NOTE,macOS capture_live_ax 返回 SkippedSelf;壳子把该拍算作心跳
    proven_by:
      - { test: 只有pid等于自己才算自我观察_未知pid不算, file: crates/guard-vision/src/uitree.rs }
      - { test: 只有警告没有事件的一拍不更新心跳, file: apps/desktop-windows/src-tauri/src/lib.rs }
    note: pid 比对在 Rust 侧(可测);原生桥填 pid 那一行(ObjC / UIA)只能在真机上验;SCK 整屏帧无法按 pid 排除

  - id: ovl-010-instruction-shape
    claim: OVL-010「树里有、屏幕上没有」只在未渲染文字具指令形状时才报——OCR 漏读普通标签不再触发 Critical 阻断
    area: vision
    source:
      doc: docs/windows-observation.md
      anchor: "unrendered tokens to look like an instruction"
    mechanism: guard_vision::viewtree::instruction_shape(强词一个即可、弱词需两个不同),叠加在 15% 占比与 ≥3 token 之上
    proven_by:
      - { test: ocr漏读普通标签不算隐藏指令, file: crates/guard-vision/src/viewtree.rs }
      - { test: 单个弱词不算指令形状_两个不同弱词才算, file: crates/guard-vision/src/viewtree.rs }
      - { test: 少数派隐藏注入被抓到, file: crates/guard-vision/src/viewtree.rs }
      - { test: 中文隐藏指令仍被抓到, file: crates/guard-vision/src/viewtree.rs }
    note: 词表是有限的:用词表外的动词写的隐藏指令会被漏掉,这是精确率换来的召回代价;注入短语规则(OVL-004 等)不受影响,仍对 ui_text 全文生效

  - id: extension-url-minimization
    claim: 转发给宿主与本地最近列表里的 URL 都最小化——去 userinfo/fragment/全部 query,形似令牌的路径段打成 …;非 http(s) 不外传
    area: extension
    source:
      doc: apps/extension-chromium/STORE.en.md
      anchor: "token-shaped path segments become"
    mechanism: guard-gate.js minimizeUrl(默认 query 白名单为空,写死并有测试钉住),background.js 所有 url 出口经它
    proven_by:
      - { test: "minimizeUrl:去掉 userinfo / fragment / 全部 query,只留 origin+path", file: apps/extension-chromium/scripts/gate.test.mjs }
      - { test: "minimizeUrl:path 里像 token 的段打成 …", file: apps/extension-chromium/scripts/gate.test.mjs }
      - { test: "minimizeUrl:非 http(s) 与畸形输入不外传", file: apps/extension-chromium/scripts/gate.test.mjs }
    note: 令牌形状是启发式(≥16 位 hex / ≥20 位 base64url),短令牌或嵌在普通词里的令牌看不出来;title 本地保留但截断到 120 字

  - id: native-link-replay-protection
    claim: 扩展↔宿主长连接带连接级 nonce 与单调 seq,宿主拒绝重放、乱序、nonce 不符的帧;hello 带回暂停状态
    area: native-host
    source:
      doc: apps/extension-chromium/STORE.en.md
      anchor: "rejects replayed, out-of-order or mismatched frames"
    mechanism: guard-nm-host SeqGuard(hello 登记 nonce/seq,之后逐帧校验);background.js connectNative + postFrame 编号
    proven_by:
      - { test: hello之后帧必须带同一nonce且seq单调递增, file: crates/guard-nm-host/src/main.rs }
      - { test: hello带回暂停状态, file: crates/guard-nm-host/src/main.rs }
      - { test: 没有hello的连接按legacy放行, file: crates/guard-nm-host/src/main.rs }
    note: 只约束帧,不认证进程(STORE「本机 host 安全边界」如实写明);没有 hello 的旧调用方按 legacy 放行且 stderr 记一行

  - id: device-policy-enforced
    claim: 设备策略只在验过签后装进引擎并真的作用于判决——只收紧不放宽;未验证的只显示不执法;同步失败保持上一份
    area: shells
    source:
      doc: docs/device-policy.md
      anchor: "只收紧,不放宽。"
    mechanism: guard_core::device_policy::EnforcedPolicy::apply 叠在每条判决上;壳子 load_device_policy 只在 sync_to_cache_verified 成功时 set_device_policy
    proven_by:
      - { test: 设备策略在引擎判决上执法且随会话agent生效, file: crates/guard-core/src/lib.rs }
      - { test: 策略永远不放宽判决, file: crates/guard-core/src/device_policy.rs }
      - { test: 已认证缓存可再验, file: crates/guard-sync/src/lib.rs }
    note: 壳子侧"验过才装"的分支在 Linux 只能编译到;策略无过期字段;allowed_agents 比对的是会话声明的 agent 名而非已验证身份

  - id: confirm-timeout-and-restart
    claim: 高危确认两分钟没人拍板按拒绝处理并写 Timeout 回执;重启后上次遗留的待确认逐条写回执而不是静默丢失
    area: shells
    source:
      doc: docs/消费者化界面.md
      anchor: "两分钟没人拍板"
    mechanism: ConfirmQueue::expire / snapshot;壳子 sweep_expired_confirms 在 get_status/get_pending_confirm 调用,restore_orphaned_confirms 在启动时处理落盘快照
    proven_by:
      - { test: 超时项被移出且之后解析为stale_未超时与无时间项留下, file: crates/guard-core/src/confirm_queue.rs }
      - { test: 快照不含ui摘录且可json往返, file: crates/guard-core/src/confirm_queue.rs }
    note: 系统级通知(macOS 通知中心 / Windows toast)未接;现在的提醒面是窗口拉前、菜单栏「‖ N」与窗口标题。落盘快照不含观测文本

  - id: webhook-replay-protection
    claim: 计费 webhook 要求 event_id / created_ms / version,幂等去重、±10 分钟时间窗、版本单调——refund 后重放旧 purchase 不能恢复 Pro
    area: billing
    source:
      doc: docs/billing.md
      anchor: "重放与乱序保护"
    mechanism: guard_billing::admit_webhook + WebhookState 幂等表(授权文件旁);HTTP 接收端 body 上限 64 KiB
    proven_by:
      - { test: refund后重放旧purchase被版本与时间窗双重拒绝, file: crates/guard-billing/src/lib.rs }
      - { test: 缺event_id_created_ms_version任一即拒, file: crates/guard-billing/src/lib.rs }
    note: 幂等表保留最近 512 个 event_id;更旧的重放靠时间窗与版本挡

  - id: local-api-hardening
    claim: Local API 默认审计库在用户私有目录且拒绝符号链接/共享可写目录;请求体 256 KiB、limit 1000 上限;令牌默认脱敏不进 stderr
    area: local-api
    source:
      doc: docs/local-api.md
      anchor: "审计库位置与请求上限"
    mechanism: guard_localapi::check_audit_db_location / default_audit_db_path / read_body_capped / mask_token
    proven_by:
      - { test: 审计库位置拒绝符号链接与共享可写目录, file: crates/guard-localapi/src/lib.rs }
      - { test: 请求体上限与limit夹紧, file: crates/guard-localapi/src/lib.rs }
      - { test: 令牌脱敏显示, file: crates/guard-localapi/src/lib.rs }
    note: 目录权限位检查只在 Unix;没有速率限制与并发上限

  - id: android-state-derived
    claim: Android 端「守护中 / 已连接」由状态机从事实推出——无障碍服务未绑定的会话不是 active,关闭的中继不是 connected,空判决的成功也清旧错误
    area: android
    source:
      doc: docs/android-completeness.md
      anchor: "State is derived, not assembled."
    mechanism: ProtectionState.derive(sessionActive, accessibilityBound, relayEnabled, lastOk, lastError, now);RelayClient.postAsync 成功一律 recordOk + clearRelayError
    proven_by:
      - { test: "session without accessibility binding is permission required, not active", file: apps/android-companion/app/src/test/java/com/agentguard/companion/ProtectionStateTest.kt }
      - { test: "relay disabled is disabled, and does not degrade the guard", file: apps/android-companion/app/src/test/java/com/agentguard/companion/ProtectionStateTest.kt }
      - { test: "newest of ok and error wins", file: apps/android-companion/app/src/test/java/com/agentguard/companion/ProtectionStateTest.kt }
    note: JVM 单测;真机上的绑定/重启/通知路径只编译过

  - id: android-event-log-bounded
    claim: Android 原始事件 JSONL 有保留期 14 天、20 个文件、50 MiB 总量、5 MiB 单文件轮转,并有用户可见的清除入口
    area: android
    source:
      doc: docs/android-completeness.md
      anchor: "The raw event log is bounded."
    mechanism: EventLogRetention.select 纯函数;EnvelopeSink.append 轮转后应用;clearAll 按钮
    proven_by:
      - { test: "old files go, current session file never goes", file: apps/android-companion/app/src/test/java/com/agentguard/companion/EventLogRetentionTest.kt }
      - { test: "total size cap deletes from the oldest until under the cap", file: apps/android-companion/app/src/test/java/com/agentguard/companion/EventLogRetentionTest.kt }
    note: 策略是纯函数并有测试;文件系统那一层(rename/delete)在设备上跑


  - id: acceptance-trace-check
    claim: 真机验收有机器判据——壳子留 trace,`acceptance-trace-check` 对照审计库核对回执落点、结束后不采、状态有心跳背书,任一 FAIL 退出 1
    area: acceptance
    source:
      doc: docs/acceptance-runbook.md
      anchor: "guard-cli acceptance-trace-check --trace evidence/macos/trace.jsonl"
    mechanism: guard-core::acceptance_trace::check 六项纯函数检查;guard-cli 子命令读库跑它并打 AGENTGUARD_ACCEPTANCE_TRACE_CHECK 标记;两个壳子在 AGENTGUARD_ACCEPTANCE_TRACE 下写 JSONL
    proven_by:
      - { test: 回执落错记录退出1并点名, file: crates/guard-cli/tests/验收trace判据.rs }
      - { test: 会话结束后仍有观察记录退出1, file: crates/guard-cli/tests/验收trace判据.rs }
      - { test: 一致的trace与库通过并打出marker, file: crates/guard-cli/tests/验收trace判据.rs }
    note: trace 由壳子自己写——它证明的是"壳子说的和库里记的一致",不是独立见证;截图与真机仍是必要证据

  - id: acceptance-fixtures-trigger
    claim: W3/W4/W5 的验收固件会触发它们声称的规则(OVL-008 / OVL-011 / OVL-006 / OVL-009),对照图零 finding
    area: acceptance
    source:
      doc: docs/acceptance-runbook.md
      anchor: "每次 `cargo test` 都在证明这些固件**真的触发**它们声称的规则"
    mechanism: scripts/acceptance/make-fixtures.py 确定性生成(存储块 PNG);tests/验收固件.rs 逐字节读回过 stats_from_pixels + analyze_frame;render-fixtures.mjs 用真 Chromium 渲染 HTML 固件再过探测器
    proven_by:
      - { test: 固件触发其声称的规则_对照图零finding, file: crates/guard-vision/tests/验收固件.rs }
      - { test: w4固件的像素文本对树文本触发_ovl009, file: crates/guard-vision/tests/验收固件.rs }
    note: OCR 本身读不读得出(W4)与 GDI 真抓到什么仍是真机的事;渲染契约测试默认 ignore,make acceptance-fixtures 才跑

  - id: adapter-ingress-visible
    claim: 桌面 API 对每份签名 body 的验签结论可读——回应带 adapter_identity,/v1/status 计数 verified / unsigned / rejected(Android A2 的桌面侧证据)
    area: local-api
    source:
      doc: docs/acceptance-runbook.md
      anchor: "`/v1/events` 现在把每份 body 的签名结论"
    mechanism: guard-localapi::AdapterIngressStats 每次入站 record();回应 JSON 的 adapter_identity 与 stderr 日志同源
    proven_by:
      - { test: 端到端_伪造的干净调查清不掉锁存的风险, file: crates/guard-localapi/src/lib.rs }
    note: 计数在进程内存里,重启归零;它是验收期的证据,不是审计记录

  - id: ask-user-visible-guess-named
    claim: 智能体「问用户」而不是「编」在审计里可见(USER-QUERY),编出来的 HIGH 层个人信息有名字(PRIV-GUESS);用户拒绝后仍编抬到 High
    area: privacy
    source:
      doc: docs/myphonebench-mapping.md
      anchor: "`form_fill.value_source: generated` on a HIGH-tier key → `PRIV-GUESS`"
    mechanism: EventType::UserQuery → PrivacySession.record_clarification;decide_form_fill 对 value_source=generated 且 flow_tier=High 的填写按 on_generated_pii_fill 判决,引用最近一次澄清结果;计数不进 composite
    proven_by:
      - { test: 生成的high层值在没问用户时报priv_guess, file: crates/guard-privacy/src/session.rs }
      - { test: 用户拒绝后仍生成抬到high, file: crates/guard-privacy/src/session.rs }
      - { test: 用户给的或记忆来的或low层的或未声明的都不报guess, file: crates/guard-privacy/src/session.rs }
      - { test: user_query事件被记录且生成值的填写引用它, file: crates/guard-core/src/lib.rs }
    note: provenance 由宿主声明——守卫核对宿主说的话之间是否一致,不核对宿主有没有说谎;不声明就不触发,LOW 层键不管

  - id: license-commercial-boundary
    claim: 企业功能只对厂商 Ed25519 签名的有效授权解锁;HMAC / webhook / 夹具签名的演示授权显示成 Enterprise 但不解锁;必须有到期日,7 天离线宽限,厂商签名的撤销名单
    area: billing
    source:
      doc: docs/billing.md
      anchor: "持公钥的一方签不出"
    mechanism: guard-billing::license — SignedLicense::issue/verify_at(域分隔文本签名)、RevocationList、OFFLINE_GRACE_MS;Entitlement.source 决定 is_commercial;load_entitlement 每次重新验 store 旁的 token
    proven_by:
      - { test: 篡改声明或换钥都验不过, file: crates/guard-billing/src/license.rs }
      - { test: 到期后先宽限再free_且必须有到期日, file: crates/guard-billing/src/license.rs }
      - { test: 撤销名单按serial撤旧留新_且名单自己要验签, file: crates/guard-billing/src/license.rs }
      - { test: 夹具签的授权不是商业边界, file: crates/guard-billing/src/license.rs }
      - { test: enterprise_export门控, file: crates/guard-billing/src/lib.rs }
    note: 边界是"没人能自己签发",不是"没人能改客户端";CRL 的传输与平台收据校验没有实现
