name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# 每个 `uses:` 都钉在 commit SHA 上,尾注是它对应的 tag(真机报告 P2-6)。
# 浮动 tag(`@v4`)意味着这条流水线的一半代码由第三方随时可换 —— 对一个签发布证据的
# 流水线,这不是供应链,是别人的供应链。要升级:`git ls-remote --tags https://github.com/<repo> refs/tags/<tag>^{}`
# 取 SHA,改这里,尾注一起改。dtolnay/rust-toolchain 的 `@stable` / `@1.87` 是**分支**不是 tag,
# 所以钉 master 的 SHA,工具链版本用 `with.toolchain` 显式传。

jobs:
  # 格式化和 workspace 级 clippy。
  #
  # 以前这两条**都不在 CI 里** —— clippy 只覆盖 win-adapter,fmt 一个字都没查。
  # 结果是 68 个文件漂出 rustfmt 规范,而且其中藏着一条 clippy 错误
  # (guard-jail 的 redundant closure):那一行的旧折行让它一直没被报出来,
  # 把 fmt 接进门禁的那一刻它才蹦出来。
  #
  # 单独一个 job,不塞进 `test`:这两条几秒钟就跑完,而 `test` 那个 matrix 要几分钟。
  # 一个格式问题不该让人等完整套测试才看到。
  lint:
    name: fmt + clippy（workspace，-D warnings）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned below
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: 供应链审计（advisories / licenses / bans / sources）
        # 以前完全没有。首次真跑抓到 22 个 crate 都没标 publish = false ——
        # 一次手滑的 `cargo publish` 能把 `guard-core` 永久钉在 crates.io 上。
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - name: cargo deny —— macOS 壳子的 lockfile(P2-6:以前两个 Tauri workspace 从未被查)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: apps/desktop-macos/src-tauri/Cargo.toml
          arguments: --all-features --config deny.shells.toml
      - name: cargo deny —— Windows 壳子的 lockfile
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: apps/desktop-windows/src-tauri/Cargo.toml
          arguments: --all-features --config deny.shells.toml
      - name: cargo clippy（--all-targets 是必须的）
        # `--all-targets` 让它看得见 `#[cfg(test)]`。没有这个参数,clippy 默认
        # 根本不检查测试代码 —— 而测试里的错误和产品代码里的一样会误导人。
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned below
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test --workspace
      - name: Eval scenarios
        run: cargo run -p guard-cli -- eval --scenarios eval/scenarios
      - name: Coverage matrix (verified against rules + scenarios)
        run: make coverage

      - name: Scoreboard
        run: |
          cargo run -p guard-cli -- scoreboard \
            --scenarios eval/scenarios \
            --out eval/scoreboard.json \
            --html eval/scoreboard.html
      - name: Upload scoreboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoreboard-${{ matrix.os }}
          path: |
            eval/scoreboard.json
            eval/scoreboard.html
      - name: Audit signing (keygen + signed log + tamper detection)
        run: make audit-signing-demo

      - name: Frame integrity (A4 localized-edit vs global repaint)
        run: make frame-digest-demo

      - name: Policy + shell smoke
        run: |
          cargo run -p guard-cli -- policy-status --policy policies/pro-trial.yaml
          cargo run -p guard-cli -- policy-sync --source policies/enterprise-poc.yaml --cache /tmp/ag-policy.yaml
          cargo run -p guard-cli -- shell-propose --tool browser.click --action navigate
      - name: Leaderboard + billing webhook
        run: |
          cargo run -p guard-cli -- leaderboard
          cargo run -p guard-cli -- billing-webhook --file eval/fixtures/billing_webhook_purchase.json --store /tmp/ag-ent.json
          cargo run -p guard-cli -- entitlement-status --store /tmp/ag-ent.json
      - name: Sim capture + netmon + billing
        run: |
          cargo run -p guard-cli -- sim-capture --confirm deny
          cargo run -p guard-cli -- netmon-check --flow eval/fixtures/netmon_malicious_flow.json
          TOK=$(cargo run -q -p guard-cli -- entitlement-issue --license-id ci --plan pro)
          cargo run -p guard-cli -- entitlement-activate --token "$TOK" --store /tmp/ag-ent2.json
          cargo run -p guard-cli -- entitlement-status --store /tmp/ag-ent2.json
      - name: Local API + SCK probe (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo run -p guard-cli -- sck-probe
          cargo test -p guard-localapi --lib
      - name: Local API (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p guard-localapi --lib
      - name: Sim mac (macOS only)
        if: runner.os == 'macOS'
        run: cargo run -p guard-cli -- sim-mac --confirm deny
      - name: Sim android
        run: cargo run -p guard-cli -- sim-android --confirm deny

  # ---------------------------------------------------------------------------
  # The three platforms this project claims to run on, each verified by the
  # toolchain that would actually build it.
  #
  # Before this, CI ran `cargo test` on macOS and Ubuntu and nothing else: no
  # Windows runner, no Android SDK, no Tauri build. So "runs on macOS, Windows
  # and Android" rested on code that had never been compiled for two of the
  # three. Both desktop shells in fact could not be built at all — they
  # declared icon files that were not in the repository — and the Kotlin
  # companion had no test target, which is how four event serializers sat with
  # no callers.
  # ---------------------------------------------------------------------------

  windows:
    name: Windows (native adapter + shell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned below
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test the workspace on Windows
        run: cargo test --workspace
      - name: Build the native adapter with the real Win32 bindings
        # `cfg(windows)` gates the UI Automation walk and the GDI capture, so this is the
        # only job in which that code is compiled at all.
        run: cargo build -p win-adapter --all-targets
      - name: Clippy on the native adapter, warnings denied
        # A warning is what caught this iteration's worst bug: `match` arms over the
        # windows crate's lower-camel-case control-type constants were bindings, not
        # comparisons, so every UI element classified as an editable field.
        run: cargo clippy -p win-adapter --all-targets -- -D warnings
      - name: Build the desktop shell
        working-directory: apps/desktop-windows/src-tauri
        run: cargo test --locked
      - name: Smoke-test the desktop window
        shell: pwsh
        working-directory: apps/desktop-windows/src-tauri
        run: |
          cargo build --locked
          $exe = Join-Path $PWD 'target\debug\desktop-windows.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'desktop-windows-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'desktop-windows-stderr.log'
          $process = Start-Process -FilePath $exe -WorkingDirectory $PWD -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "desktop-windows exited during startup with code $($process.ExitCode)"
            }
            if ($process.MainWindowHandle -eq [IntPtr]::Zero) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw 'desktop-windows stayed alive but did not create a native window'
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }

  macos-shell:
    name: macOS shell (native AX + SCK)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned below
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the mac adapter with the Objective-C bridges
        # The AX walker and the ScreenCaptureKit bridge are compiled by build.rs through
        # `cc`, so they need the macOS SDK. This is the only job that compiles them.
        run: cargo build -p mac-adapter --all-targets
      - name: Test the desktop shell
        working-directory: apps/desktop-macos/src-tauri
        run: cargo test
      - name: Signing script parses (bash -n)
        run: bash -n apps/desktop-macos/scripts/sign-and-notarize.sh
      - name: Signing script signs a bundle ad-hoc and codesign verifies it
        # Real-device report P1-8: this step used to be named "runs and produces a verifiable
        # signature" while executing only `bash -n`. Now it does what the name says, on a
        # minimal stand-in bundle (a compiled binary in Contents/MacOS + Info.plist): the script
        # runs end to end in ad-hoc mode, `codesign --verify --deep --strict` passes, and the
        # identifier it stamped is the one TCC keys grants to. Still ad-hoc — no Developer ID,
        # no notarization; those need credentials this job does not have and must not fake.
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/StandIn.app"
          mkdir -p "$APP/Contents/MacOS"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/main.c"
          cc -o "$APP/Contents/MacOS/StandIn" "$RUNNER_TEMP/main.c"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>StandIn</string>
            <key>CFBundleIdentifier</key><string>com.agentguard.desktop.macos</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleName</key><string>StandIn</string>
          </dict></plist>
          PLIST
          unset APPLE_SIGNING_IDENTITY
          bash apps/desktop-macos/scripts/sign-and-notarize.sh "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -q 'Identifier=com.agentguard.desktop.macos'

  android:
    name: Android companion (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Explicit rather than relying on AGP's auto-download: an implicit fetch is a
          # network dependency inside the build step, and when it fails the error is a
          # Gradle stack trace about a missing platform rather than "the SDK is not here".
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: JVM unit tests (no device, no instrumented tests)
        # The Kotlin half had zero tests. These include the cross-language dHash contract:
        # the Rust comparator and the Kotlin producer both assert against
        # eval/fixtures/icon_dhash_vectors.json, so a drift fails on both sides instead of
        # silently turning every icon comparison into noise.
        working-directory: apps/android-companion
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Android lint (warnings are errors — real-device report P2-2)
        # 14 warnings were cleared and `lint { warningsAsErrors = true }` is set in
        # app/build.gradle.kts, so a new warning fails this job instead of sitting in an HTML
        # report nobody opens. The report is still uploaded below for the failing case.
        working-directory: apps/android-companion
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Upload the lint report (only useful when the step above failed)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentguard-companion-lint
          path: apps/android-companion/app/build/reports/lint-results-debug.*
      - name: Assemble the DEBUG APK (Android debug certificate — not a release artifact)
        working-directory: apps/android-companion
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentguard-companion-debug
          path: apps/android-companion/app/build/outputs/apk/debug/*.apk

  browser-e2e:
    name: Chromium extension real-browser E2E + acceptance fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned below
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        # Global install, matching how eval/e2e-extension/run.mjs resolves playwright (local
        # node_modules first, then `npm root -g`). The repository has no package.json at the
        # root on purpose — the extension ships as plain files.
        run: |
          npm install -g playwright@1.56.0
          npx --yes playwright@1.56.0 install --with-deps chromium
      - name: Desktop shells — confirm-modal accessibility contract (P2-4)
        # Stubs window.__TAURI__ and asserts alertdialog semantics, focus trap, Escape,
        # inert background and the screen-reader announcement channel in real Chromium.
        run: make shell-a11y
      - name: Real-browser E2E (C1–C5 of docs/acceptance-chrome.md)
        # Loads apps/extension-chromium unpacked into a real Chromium and asserts the
        # pre-execution gates against eval/acceptance-fixtures. Not part of release-gate
        # (needs a browser); a FAIL here is still a FAIL of the extension.
        run: make e2e-extension
      - name: Acceptance fixtures render + detector contract (W3/W4/W5)
        # Generates the deterministic fixtures, renders the HTML ones in real Chromium and
        # runs guard-vision over every pixel buffer, including the ignored render-contract test.
        run: make acceptance-fixtures
      - name: Upload E2E report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-e2e
          path: |
            eval/e2e-extension/out/
            eval/acceptance-fixtures/generated/MANIFEST.json
            eval/acceptance-fixtures/generated/rendered/INDEX.json

  jail:
    name: 内核约束（guard-jail）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned below
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 探测这台 runner 上有哪些后端
        # 先打印出来。一个静默跳过的安全测试和一个不存在的测试没有区别，所以要能在日志里
        # 看到这次跑到底验了什么。
        run: cargo run -p guard-jail --bin agentguard-jail -- --probe
      - name: 内核真的在拦
        # 集成测试会从 jail 外面用文件系统状态核对结果。没有可用后端时它们跳过并打印原因。
        run: cargo test -p guard-jail

  macos-paths:
    name: macOS 专属代码路径能编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned below
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 把 macOS 的 cfg 改写成 linux 再编
        # Linux 上 cargo check 会整块跳过 #[cfg(target_os = "macos")],所以那半边
        # 代码在 CI 上从来没被编译过。本项目为此栽过两次:mac-adapter 少了一个
        # use std::ffi::CStr(被 clippy --fix 删掉的,因为 Linux 上它确实未使用),
        # 以及更早 NativeWinAdapter 不是 Send。两次都只在目标平台上失败。
        #
        # 这个 job 有一个 macos-latest 的 runner 也能跑的版本(直接 cargo check),
        # 但它在 ubuntu 上跑,所以每一个 PR 都会经过它,不必等 macOS runner 排队。
        run: make check-macos-paths

  msrv:
    name: MSRV 1.87
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; MSRV pinned below
        with:
          toolchain: '1.87'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 用 MSRV 跑整个 workspace 的测试
        # Cargo.toml 里的 rust-version 只是一个声明,声明不是执行。没有这个 job,
        # 任何人用了一个 1.88 才有的 API,MSRV 就静默抬高一格,而所有测试仍然全绿 ——
        # 因为大家都在 stable 上跑。1.87 这条线是测出来的:1.86 编不过
        # （guard-privacy 的 Luhn 校验用了 is_multiple_of）。
        #
        # RUSTUP_TOOLCHAIN 显式压过仓库根的 rust-toolchain.toml(它钉的是**发布**工具链 1.95.0);
        # 少了这一行,这个 job 会静默地在 1.95 上跑,而名字还叫 MSRV。
        env:
          RUSTUP_TOOLCHAIN: '1.87'
        run: |
          cargo --version | grep -q ' 1\.87\.' || { echo "MSRV job is not running on 1.87: $(cargo --version)"; exit 1; }
          cargo test --workspace

  preflight:
    name: 部署自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned below
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 门禁 —— 自检结论必须和基线一致
        # 以前这里是 `cargo run ... preflight || true`,和 Makefile 里那个前缀减号
        # 同一个毛病:仓库自带的策略**应该**报 FAIL(发布注册表钉的是夹具密钥),
        # 所以退出码不能直接当门禁 —— 于是它被吞掉了,于是一个**新出现**的 FAIL
        # 也不拦任何人。
        #
        # 现在比的是"结论有没有变"。多一条拦,**少一条也拦** —— 一项检查被删掉之后
        # 它的结论会消失,而"少了一条 WARN"看起来像修好了什么。
        # 结论随机器而变的族(jail.*、api.token.*)在基线里只记族名,所以换 runner 不假警。
        run: make preflight
      - name: 门禁 —— 仓库自带的策略必须报 FAIL,且原因必须是夹具密钥
        run: cargo test -p guard-cli preflight

  frontend:
    name: Shell front ends parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax-check every shell script and front-end module
        # No JS was checked by anything before. A syntax error in main.js produced a shell
        # whose buttons silently did nothing, and the Rust side would still be green.
        #
        # One `make` target rather than a copy of the loop, because the first version of this
        # job and the Makefile target had the same bug in two places: a
        # `|| node --input-type=module -e "import(...)"` fallback that swallowed the failure and
        # made both checks pass on a file with a syntax error.
        run: make check-shells
